services:

  # ──────────────────────────────────────────
  #  PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: takesmart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-takesmart}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-takesmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  #  Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: takesmart_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  #  FastAPI приложение
  # ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takesmart_api
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
    volumes:
      - static_data:/app/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_data:
