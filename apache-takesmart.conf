<VirtualHost *:80>
    # ── Замените на ваш домен или IP ──────────────────────────────────────────
    ServerName YOUR_DOMAIN_OR_IP
    # ServerAlias www.YOUR_DOMAIN_OR_IP

    # ── Включить модули прокси (один раз для всего сервера) ───────────────────
    # Если не включены: sudo a2enmod proxy proxy_http headers rewrite

    # ── Proxy всего трафика в Docker Nginx ────────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # ── Логи ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/takesmart_error.log
    CustomLog ${APACHE_LOG_DIR}/takesmart_access.log combined
</VirtualHost>
