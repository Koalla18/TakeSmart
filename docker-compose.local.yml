services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: take_smart
      POSTGRES_USER: take_smart
      POSTGRES_PASSWORD: take_smart_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U take_smart -d take_smart"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOT exposed externally — only accessible within Docker network

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # NOT exposed externally

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://take_smart:take_smart_local@db:5432/take_smart
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: take_smart
      DB_PASSWORD: take_smart_local
      DB_NAME: take_smart
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    volumes:
      # Persist uploaded files (legacy)
      - uploads:/app/uploads
      # Persist media files (new storage system)
      - static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOT exposed externally — nginx proxies to it

  # ─── Frontend (Nginx serves SPA + proxies /api → backend) ──────────────────
  # Apache on the host proxies port 80 → this container on port 3000
  frontend:
    build:
      context: ./frontend
      args:
        # Empty = relative URLs → nginx proxies /api/* to backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  static:
