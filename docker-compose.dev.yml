# docker-compose.dev.yml — LOCAL DEVELOPMENT overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production:
#  - Frontend runs Vite dev server (HMR) instead of built nginx image
#  - Backend/DB/Redis ports are exposed for debugging
#  - No healthcheck wait (faster startup)

services:

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Live-reload code in dev
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      # Persist static media files in dev
      - ./backend/static:/app/static

  frontend:
    build:
      context: ./frontend
      # Override to use dev Dockerfile
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
