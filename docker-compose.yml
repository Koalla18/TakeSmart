services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-take_smart}
      POSTGRES_USER: ${POSTGRES_USER:-take_smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-take_smart_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-take_smart} -d ${POSTGRES_DB:-take_smart}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOT exposed externally — only accessible within Docker network

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # NOT exposed externally

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-take_smart}:${POSTGRES_PASSWORD:-take_smart_password}@db:5432/${POSTGRES_DB:-take_smart}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      # Persist uploaded files
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOT exposed externally — nginx proxies to it

  # ─── Frontend (Nginx serves SPA + proxies /api → backend) ──────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Empty = relative URLs → nginx proxies /api/* to backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
