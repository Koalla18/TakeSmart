# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Timeweb App Platform
#
# Ограничения Timeweb которые соблюдены здесь:
#   • Порты 80/443 НЕ используются как хост-порты
#   • Директива volumes НЕ используется
#   • frontend — ПЕРВЫЙ сервис (Timeweb проксирует именно его на домен)
#
# ⚠️  БД и Redis — подключите через Timeweb DBaaS (отдельные сервисы в панели)
#     и задайте переменные в настройках приложения:
#       DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
#       REDIS_HOST, REDIS_PORT, REDIS_PASSWORD (или оставьте пустыми)
#
# Для локальной разработки с полным стеком — см. docker-compose.local.yml
# ──────────────────────────────────────────────────────────────────────────────
services:

  # ─── Frontend ★ ПЕРВЫЙ — проксируется Timeweb на основной домен ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пустой = nginx внутри контейнера сам проксирует /api/* на backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ━ Задайте в панели Timeweb ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-changeme-set-in-panel}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-set-in-panel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STATIC_DIR: /app/static
    ports:
      - "8000:8000"
