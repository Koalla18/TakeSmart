# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Timeweb App Platform
#
# Ограничения Timeweb которые соблюдены здесь:
#   • Порты 80/443 НЕ используются как хост-порты
#   • Директива volumes НЕ используется
#   • frontend — ПЕРВЫЙ сервис (Timeweb проксирует именно его на домен)
#
# ⚠️  БД и Redis — подключите через Timeweb DBaaS (отдельные сервисы в панели)
#     и задайте переменные в настройках приложения (Шаг 6):
#       DATABASE_URL = postgresql+asyncpg://user:pass@host:5432/dbname
#       REDIS_URL    = redis://user:pass@host:6379/0   (или оставьте пустым)
#
# Для локальной разработки с полным стеком — см. docker-compose.local.yml
# ──────────────────────────────────────────────────────────────────────────────
services:

  # ─── Frontend ★ ПЕРВЫЙ — проксируется Timeweb на основной домен ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пустой = nginx внутри контейнера сам проксирует /api/* на backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ━ Задайте в панели Timeweb ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:-changeme-set-in-panel}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-set-in-panel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8000:8000"
