services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-take_smart}
      POSTGRES_USER: ${POSTGRES_USER:-take_smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-take_smart_password}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-take_smart}:${POSTGRES_PASSWORD:-take_smart_password}@db:5432/${POSTGRES_DB:-take_smart}
      REDIS_URL: redis://redis:6379/0
      PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    env_file:
      - ./.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
