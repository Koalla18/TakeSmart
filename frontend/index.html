<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/lion.jpg" />
    <link rel="apple-touch-icon" href="/lion.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LCP: первый баннер hero рендерится сразу — предзагружаем его картинку -->
    <link rel="preload" as="image" href="/iphone-17-pro.png" fetchpriority="high" />
    <!-- Фото товаров лежат в S3 (s3.twcstorage.ru) — заранее открываем соединение.
         Это только сетевой hint, URL/хранилище НЕ меняются. -->
    <link rel="preconnect" href="https://s3.twcstorage.ru" crossorigin />
    <link rel="dns-prefetch" href="https://s3.twcstorage.ru" />
    <!-- SEO. Для поисковых роботов и превью ссылок (Яндекс, Google, Telegram, VK…) nginx
         включает SSI и подставляет вместо блока ниже заголовок, описание, canonical и
         разметку именно этой страницы — их отдаёт бэкенд (/api/v1/seo/head/…).
         Обычным посетителям SSI не включается: комментарии ниже браузер пропускает,
         а теги внутри блока остаются как есть. Заголовок вкладки при переходах
         обновляет сам сайт (SeoTracker в App.tsx). -->
    <!--# block name="seo_head" -->
    <title>TakeSmart — магазин техники Apple, Samsung и Sony в Москве</title>
    <meta name="description" content="Смартфоны, ноутбуки, планшеты, часы, наушники и игровые консоли с гарантией. Самовывоз у м. Багратионовская, доставка по Москве за 30 минут и по России. Trade-in и рассрочка." />
    <meta property="og:site_name" content="TakeSmart" />
    <meta property="og:title" content="TakeSmart — магазин техники Apple, Samsung и Sony в Москве" />
    <meta property="og:description" content="Смартфоны, ноутбуки, планшеты, часы, наушники и игровые консоли с гарантией. Доставка по Москве и России." />
    <meta property="og:image" content="https://takesmart.ru/lion.jpg" />
    <meta property="og:type" content="website" />
    <!--# endblock -->
    <!--# include virtual="/__seo/head$request_uri" stub="seo_head" -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Yandex.Metrika counter -->
    <!-- На странице заказа на установку приложений (/i/<ключ>) счётчик не запускается:
         в адресе личный ключ заказа, на экране Apple ID и код подтверждения. -->
    <script type="text/javascript">
      if (!/^\/i\//.test(location.pathname)) {
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
        k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');

      window.dataLayer = window.dataLayer || [];
      ym(110553535, 'init', {
        webvisor: true,
        clickmap: true,
        ecommerce: 'dataLayer',
        accurateTrackBounce: true,
        trackLinks: true,
      });
      }
    </script>
    <!-- /Yandex.Metrika counter -->
  </head>
  <body>
    <noscript><div><img src="https://mc.yandex.ru/watch/110553535" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!--# block name="seo_empty" --><!--# endblock -->
    <div id="root"><!--# include virtual="/__seo/body$request_uri" stub="seo_empty" --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
