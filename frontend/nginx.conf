# ── Роботы поисковиков и сборщики превью ссылок ──────────────────────────────
# Им отдаём index.html с подставленными заголовком, описанием, canonical,
# разметкой и содержимым конкретной страницы (SSI → бэкенд /api/v1/seo/…).
# Покупатели получают обычный index.html — без лишнего запроса и задержки.
map $http_user_agent $seo_bot {
    default 0;
    "~*(yandex|googlebot|google-inspectiontool|adsbot-google|mediapartners-google|storebot-google|bingbot|duckduckbot|applebot|petalbot|mail\.ru_bot|telegrambot|whatsapp|vkshare|facebookexternalhit|twitterbot|slackbot|discordbot|linkedinbot|skypeuripreview|viber)" 1;
}

# ── www.<домен> → <домен> (канонический адрес, без дублей для поисковиков) ──
# Регулярка вместо жёсткого «www.takesmart.ru» — правило переживёт смену домена.
# 308, а не 301: сохраняет метод и тело запроса, поэтому PATCH/POST из PWA
# «Заказы» (смена статуса, сохранение цен) не превращаются в GET, если кто-то
# установил приложение с www-адреса.
# TLS терминирует балансировщик Timeweb, в контейнер приходит http — поэтому
# в редиректе схема https проставлена явно, чтобы не было лишнего хопа.
server {
    listen 80;
    server_name ~^www\.(?<root_domain>.+)$;

    # ACME-проверку (выпуск/продление Let's Encrypt) не редиректим: сейчас её
    # обслуживает балансировщик Timeweb, но если однажды начнёт проксировать
    # к нам — редирект сломал бы продление сертификата.
    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 308 https://$root_domain$request_uri;
    }
}

server {
    # default_server обязателен: www-блок выше идёт первым в файле, а nginx
    # отдаёт несовпавшие Host первому server'у для этого listen. Без явного
    # флага основной домен уезжал бы в редирект с пустым $root_domain.
    listen 80 default_server;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/x-font-ttf
        application/x-web-app-manifest+json font/opentype;
    gzip_min_length 1024;

    # ── index.html: НИКОГДА не кэшировать ─────────────────────────────────────
    # Без этого браузеры (и установленное PWA «Заказы») держат старый HTML со
    # ссылками на старые бандлы и не видят свежий деплой до ручного обновления.
    # Ассеты ниже кэшируются агрессивно — их имена содержат хэш содержимого.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
    }

    # ── Service worker и манифест PWA: тоже всегда свежие (имена без хэша) ────
    location ~ ^/(app-sw\.js|app\.webmanifest)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Static frontend assets (aggressive caching) ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API proxy (/api/* → backend /api/v1/*) ──────────────────────
    location /api/ {
        rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
        proxy_pass         https://koalla18-takesmart-087b.twc1.net;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              koalla18-takesmart-087b.twc1.net;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── Карта сайта: генерируется бэкендом из живого каталога ────────────────
    location = /sitemap.xml {
        proxy_pass         https://koalla18-takesmart-087b.twc1.net/api/v1/seo/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host koalla18-takesmart-087b.twc1.net;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── SEO для роботов: index.html + SSI ─────────────────────────────────────
    # Внутренний адрес: сюда переводит @spa, если запрос пришёл от робота.
    # В index.html две вставки — /__seo/head<адрес> и /__seo/body<адрес>;
    # при ошибке бэкенда SSI оставляет обычные теги из index.html.
    location = /__seo_page {
        internal;
        root /usr/share/nginx/html;
        try_files /index.html =404;
        ssi on;
        ssi_silent_errors on;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location ^~ /__seo/ {
        internal;
        rewrite ^/__seo/(head|body)/?(.*)$ /api/v1/seo/$1/$2 break;
        proxy_pass         https://koalla18-takesmart-087b.twc1.net;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host koalla18-takesmart-087b.twc1.net;
        proxy_set_header   Accept-Encoding "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ── SPA routes that must NEVER be redirect-cached in browser ─────────────
    # These previously pointed at the backend; browsers may have cached a 301.
    # Serving them with no-cache forces the browser to always re-fetch the SPA.
    # ── SPA routes: no redirect caching (admin/login were previously proxied) ──
    # Using named location @spa_nocache to correctly apply headers with try_files.
    location ~ ^/(admin|login)(/.*)?$ {
        root  /usr/share/nginx/html;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    # Без «$uri/»: папки статики (gta6-art, products, logos…) не открываются как
    # каталоги — раньше это давало 301 → 403, если адрес страницы совпадал с папкой.
    location = / {
        root /usr/share/nginx/html;
        try_files /__nonexistent__ @spa;
    }

    location / {
        root  /usr/share/nginx/html;
        try_files $uri @spa;
    }

    location @spa {
        if ($seo_bot) {
            rewrite ^ /__seo_page last;
        }
        rewrite ^ /index.html last;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;
}
