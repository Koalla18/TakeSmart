server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/x-font-ttf
        application/x-web-app-manifest+json font/opentype;
    gzip_min_length 1024;

    # ── Static frontend assets (aggressive caching) ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API proxy (/api/* → backend /api/v1/*) ─────────────────────────
    location /api/ {
        rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
        proxy_pass         http://koalla18-takesmart-087b.twc1.net;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── Backend static files (product images etc.) ───────────────────────────
    # ^~ prevents the generic image-extension regex above from hijacking these
    location ^~ /static/ {
        proxy_pass         http://koalla18-takesmart-087b.twc1.net;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Legacy /uploads/ → backend ───────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://koalla18-takesmart-087b.twc1.net;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SPA routes that must NEVER be redirect-cached in browser ─────────────
    # These previously pointed at the backend; browsers may have cached a 301.
    # Serving them with no-cache forces the browser to always re-fetch the SPA.
    # ── SPA routes: no redirect caching (admin/login were previously proxied) ──
    # Using named location @spa_nocache to correctly apply headers with try_files.
    location ~ ^/(admin|login)(/.*)?$ {
        root  /usr/share/nginx/html;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;
}
